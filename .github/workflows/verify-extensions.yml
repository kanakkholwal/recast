name: Verify Extensions

# Gate for community extension PRs: runs the verifier over every pack so a submission cannot land unless its manifest, assets, SHA-256s and filenames check out.
# The same trust boundary the desktop installer enforces at install time. Node-only, so there is no dependency install step.

on:
  # Push is scoped to the default branch because `pull_request` covers every other one; running push on "**" double-fired CI for the same SHA.
  # Tag pushes do not match a `branches` filter, so `tags-ignore` is unnecessary.
  push:
    branches:
      - main
    paths:
      - "extensions/**"
      - ".github/workflows/verify-extensions.yml"
  pull_request:
    paths:
      - "extensions/**"
      - ".github/workflows/verify-extensions.yml"

concurrency:
  group: verify-extensions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension packs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify packs
        run: node extensions/scripts/verify-extensions.mjs
