name: Deploy to Vercel - Recast Web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Serialised per ref: two pushes to main otherwise race two production deploys AND two
# `db:migrate` runs. In-progress runs are NOT cancelled, since a half-applied migration is worse.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        # Pinned to v4: v6 bootstraps an older pnpm then runs `pnpm self-update`, which crashes on our pinned version (pnpm/pnpm#12959).
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      # Must come after pnpm/action-setup, since `cache: pnpm` shells out to `pnpm store path`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Was `pnpm run lint` with continue-on-error, but apps/web has no `lint` script:
      # the step failed on every run and the flag hid it. Biome is the real linter.
      - name: Lint
        run: pnpm exec biome lint --no-errors-on-unmatched apps/web
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm --filter recast-web test:unit

  deploy:
    name: Deploy (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production only, and before the deploy: migrations must be expand-only so the
      # currently-live code keeps working if the deploy below fails.
      - name: Apply DB migrations
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm --filter recast-web db:migrate

      # npm, not pnpm: `pnpm add -g` installs into $PNPM_HOME/bin, which action-setup@v4 leaves off PATH.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # One step for both targets. The previous preview branch was unreachable: on a
      # `pull_request` event `github.ref` is `refs/pull/<n>/merge`, never `refs/heads/main`.
      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          IS_PROD: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$IS_PROD" = "true" ]; then
            target=production; prod_flag=--prod
          else
            target=preview; prod_flag=
          fi
          vercel pull --yes --environment="$target" --token="$VERCEL_TOKEN"
          vercel build $prod_flag --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt $prod_flag --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed $target to $url"
