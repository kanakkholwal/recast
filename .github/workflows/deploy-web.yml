name: Deploy to Vercel - Recast Web

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'  # Only trigger if changes in this directory
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'  # Only trigger if changes in this directory
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'production'
      url: 'https://recast.li'
    # Set default working directory for all steps
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The version comes from the root package.json `packageManager` field; pinning it here silently drifted CI onto pnpm 10 while the repo had moved to 11.
      - name: Install pnpm
        # Pinned to v4: v6 bootstraps an older pnpm then runs `pnpm self-update`, which crashes on our pinned version (pnpm/pnpm#12959).
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # Must come after pnpm/action-setup, since `cache: pnpm` shells out to `pnpm store path`; setup-node v6 auto-caches only npm.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=recast-web --no-frozen-lockfile

      - name: Run linter (optional)
        run: pnpm run lint
        continue-on-error: true

      # Blocking on purpose: a deploy should not ship past a red test, and this used to be `continue-on-error`, so the suite could stay red indefinitely.
      # Every step here runs in apps/web, so this must name a script in apps/web/package.json; `test:web` exists only in the ROOT and would fail with "Missing script".
      - name: Run web unit tests
        run: pnpm run test:unit

      # Database migrations
      - name: Apply DB migrations (Production only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm db:migrate

      # npm, not pnpm: `pnpm add -g` installs into $PNPM_HOME/bin, which action-setup@v4 leaves off PATH, and `pnpm setup` edits a shell rc these steps never source.
      # npm's global bin is already on PATH via setup-node.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        working-directory: .

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}