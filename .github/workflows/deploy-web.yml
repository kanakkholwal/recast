name: Deploy to Vercel - Recast Web

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'  # Only trigger if changes in this directory
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'  # Only trigger if changes in this directory
  workflow_dispatch: 

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'production' || 'preview' }}
      url: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'https://recast.nexonauts.com' || 'https://recast-preview.nexonauts.com' }}
    # Set default working directory for all steps
    defaults:
      run:
        working-directory: apps/web
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm version comes from the root package.json `packageManager` field.
      # Do NOT pin it here: a hardcoded version silently drifted CI onto pnpm 10
      # while the repo had moved to 11.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Must come after pnpm/action-setup: `cache: pnpm` shells out to
      # `pnpm store path`. setup-node v6 only auto-caches npm, so pnpm has to
      # be named explicitly.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --filter=recast-web --no-frozen-lockfile

      - name: Run linter (optional)
        run: pnpm run lint
        continue-on-error: true

      # Blocking on purpose: a deploy should not ship past a red test. It used to
      # be `continue-on-error: true`, so the suite could go red indefinitely.
      # NOTE: every step here runs with `working-directory: apps/web` (see
      # `defaults` above), so this must be a script that exists in
      # apps/web/package.json. `test:web` only exists in the ROOT package.json and
      # would fail here with "Missing script".
      - name: Run web unit tests
        run: pnpm run test:unit

      # Database migrations
      - name: Apply DB migrations (Production only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm db:migrate

      # No `pnpm setup` needed: pnpm/action-setup already exports PNPM_HOME and
      # puts the global bin dir on PATH, and `pnpm setup` only writes a shell rc
      # that a non-interactive CI step never sources.
      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest
        working-directory: .

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
