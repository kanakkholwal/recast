name: Release Desktop App

# Per-step shell logic lives under `scripts/release/`; this file stays structural (matrix, gates, secrets, artifact wiring).
# The procedural detail is each its own script you can read top to bottom instead of squinting at YAML heredocs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned for reproducible release builds. Bump deliberately; do NOT track latest. Per-OS download details live in `scripts/release/download-ffmpeg-*`.
  FFMPEG_VERSION: "7.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      tag_name: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve_tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve previous tag for compare link
        id: prev_tag
        shell: bash
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Fetch the full tag history so `git describe` can find the prior tag.
          git fetch --tags --force --quiet
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: build_body
        shell: bash
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev }}
          REPO: kanakkholwal/recast
        run: bash scripts/release/build-release-body.sh

      - name: Create or reuse draft release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: Recast ${{ steps.resolve_tag.outputs.tag }}
          draft: true
          prerelease: false
          # Auto-generate "what's changed" only when the changelog has no
          # section for this tag; otherwise the curated CHANGELOG entry wins.
          generate_release_notes: ${{ steps.build_body.outputs.found != 'true' }}
          body: ${{ steps.build_body.outputs.body }}

  build-desktop:
    name: Build (${{ matrix.platform.name }})
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          # Intel Mac builds WITH on-device captions, cross-compiled on the arm64 runner because GitHub is retiring the native macos-13 image and its runners queue for hours.
          # If cross-compiling ggml for x86_64 ever fails, fall back to `--no-default-features`: Intel then ships remote-only, which is non-breaking.
          - name: macos-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
    runs-on: ${{ matrix.platform.os }}
    # A hung linker must not hold a release runner for the 360-minute default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The default Xcode on macos-latest has a clang resource dir that does not match stable rustc's LLVM, breaking the link with `library 'clang_rt.osx' not found`.
      # Pin the newest fully-installed stable Xcode so the compiler-rt path exists.
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # `latest-stable` can resolve to an Xcode RC whose toolchain lacks the compiler-rt archives rustc links, failing with `library 'clang_rt.osx' not found`.
      # Rather than gamble on the runner's Xcode, find libclang_rt.osx.a wherever it lives and add its directory to the linker search path.
      - name: Ensure compiler-rt on link path (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rt=$(find \
            "$(xcode-select -p)/Toolchains" \
            /Library/Developer/CommandLineTools/usr/lib/clang \
            /Applications/Xcode*.app/Contents/Developer/Toolchains \
            -name 'libclang_rt.osx.a' 2>/dev/null | head -n1 || true)
          if [ -z "$rt" ]; then
            echo "::error::libclang_rt.osx.a not found; cannot satisfy -lclang_rt.osx"
            exit 1
          fi
          echo "Using compiler-rt at: $rt"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -L $(dirname "$rt")" >> "$GITHUB_ENV"

      # The version comes from the root package.json `packageManager` field; pinning it here silently drifted CI onto pnpm 10 while the repo had moved to 11.
      - name: Install pnpm
        # Pinned to v4: v6 bootstraps an older pnpm then runs `pnpm self-update`, which crashes on our pinned version (pnpm/pnpm#12959).
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # One source of truth for the compiler version: `rust-toolchain.toml`.
      # dtolnay/rust-toolchain does not read it, and installing `@stable` while cargo resolves the pinned channel adds targets to the wrong toolchain.
      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: bash scripts/ci/read-toolchain.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.platform.rust_target }}

      # BOTH workspaces, and `shared-key` alone: `crates/` was uncached so every release rebuilt the
      # engine tree, and pairing `key` with `shared-key` only made the entry harder to hit.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./apps/desktop/src-tauri -> target
            ./crates -> target
          shared-key: release-${{ matrix.platform.rust_target }}
          cache-on-failure: true

      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.platform.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.platform.os }}-

      - name: Setup build environment
        shell: bash
        run: bash scripts/ci/setup-build-env.sh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache FFmpeg sidecars
        id: ffmpeg-cache
        # A flaky cache restore must never sink the release leg: on a cache error `cache-hit` stays falsy, so the download step runs and the build still gets its sidecars.
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: release-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.platform.rust_target }}
          restore-keys: |
            release-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.platform.rust_target }}-

      - name: Download FFmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        # `bash <file>`, not `./<file>`: the script is not necessarily +x on a Windows checkout, and the per-OS dispatchees are invoked the same way for the same reason.
        run: bash ./scripts/release/ensure-ffmpeg.sh '${{ matrix.platform.rust_target }}' 'apps/desktop/src-tauri/binaries'

      - name: Verify FFmpeg sidecars (encoders required for export)
        shell: bash
        run: bash scripts/release/verify-ffmpeg-sidecars.sh '${{ matrix.platform.rust_target }}' 'apps/desktop/src-tauri/binaries' '${{ matrix.platform.os }}'

      - name: Sync version from tag
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: node scripts/release/sync-version.mjs

      # Vite build-time config: `tauri build` runs the frontend build rooted at apps/desktop, so this .env is the ONLY path that inlines `PUBLIC_*` into the bundle.
      # The Google creds are inert here, reaching cargo solely through `option_env!` on the build step; the line exists for parity with the local-dev layout.
      - name: Write build-time config to apps/desktop/.env
        shell: bash
        run: |
          {
            echo "GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
            echo "GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
            echo "PUBLIC_POSTHOG_KEY=${{ secrets.PUBLIC_POSTHOG_KEY }}"
            echo "PUBLIC_POSTHOG_HOST=${{ secrets.PUBLIC_POSTHOG_HOST }}"
          } >> apps/desktop/.env

      - name: Build Tauri app
        shell: bash
        env:
          # Signs the updater artifacts so the running app can verify a download against the pubkey baked into tauri.conf.json.
          # Without these secrets `tauri build` still succeeds, but produces unsigned bundles the updater rejects.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Rust reads these at COMPILE time via `option_env!`, so they must sit in the build step's env for cargo to inherit them; release builds ignore the runtime env entirely.
          # The PostHog pair is the SAME one the frontend bundle gets above: one secret, both sides. Empty on forks means unconfigured, not broken.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          # Force portable x64 ggml: CI runners are AVX-512 Xeons, and without this the staticlib emits an AVX-512 jump table that raises STATUS_ILLEGAL_INSTRUCTION on real users' Zen 3 and pre-Skylake CPUs.
          # The scalar fallback is ~14x slower but universal. The `CMAKE_ARGS` mirror is belt-and-braces, since the sys build.rs reads both.
          TRANSCRIBE_CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
          CMAKE_ARGS:           "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
        run: pnpm --filter recast-desktop tauri build ${{ matrix.platform.tauri_args }}

      # Runs after the build and before packaging, so a release that crashes on inference fails the leg instead of shipping a broken artifact.
      # Caches the GGUF and dispatches ffmpeg through the same scripts as ci-desktop, so a passing CI run means a passing release build.
      - name: Cache smoke-test GGUF (Whisper-base, ~60 MB)
        if: matrix.platform.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: models-cache/smoke-test
          key: release-smoke-gguf-${{ matrix.platform.rust_target }}-whisper-base-Q5_K_M
          restore-keys: |
            release-smoke-gguf-${{ matrix.platform.rust_target }}-

      - name: Smoke test — ggml inference (windows-x64)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/release/smoke-test-transcription.ps1

      # One step for three per-OS branches; the dispatcher also fails loudly on an empty release-assets/.
      - name: Package platform assets
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}
        run: bash scripts/release/package-platform.sh '${{ matrix.platform.name }}' '${{ matrix.platform.rust_target }}'

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: true
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Upload updater signatures for manifest
        # Only the signatures are needed: the manifest references bundles by their release-asset URL.
        # With signing secrets unset no `.sig` exists, and the manifest job then fails loudly rather than publishing a broken updater.
        uses: actions/upload-artifact@v4
        with:
          name: updater-sigs-${{ matrix.platform.name }}
          path: release-assets/*.sig
          if-no-files-found: warn
          retention-days: 1

      - name: Upload build artifacts (debug aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recast-${{ matrix.platform.name }}-${{ needs.create-release.outputs.tag_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*
            apps/desktop/src-tauri/target/${{ matrix.platform.rust_target }}/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 7

  generate-manifest:
    name: Generate updater manifest
    needs: [create-release, build-desktop]
    # Runs even when a build leg fails, so the failure is reported as a named missing platform rather than a skipped job.
    # `--require` below still makes every platform mandatory, so this cannot publish a partial manifest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download updater signatures
        uses: actions/download-artifact@v4
        with:
          pattern: updater-sigs-*
          path: updater-sigs
          merge-multiple: true

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mjs \
            --tag "${{ needs.create-release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir updater-sigs \
            --require "windows-x86_64,linux-x86_64,darwin-aarch64,darwin-x86_64" \
            --out latest.json
          echo "----- latest.json -----"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: true
          prerelease: false
          files: latest.json
          fail_on_unmatched_files: true

  publish-release:
    name: Publish release
    needs: [create-release, build-desktop, generate-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: false
          prerelease: false

  # Homebrew (macOS) and winget (Windows) both depend only on publish-release
  # and NOT on each other, so once the release is public they run in PARALLEL.
  publish-homebrew-cask:
    name: Publish Homebrew Cask
    # Runs after the release is public, so the DMGs are downloadable from the URL the cask references.
    # The script no-ops when HOMEBREW_TAP_TOKEN is unset, so this is safe to keep enabled before the tap exists: it just notices and exits 0.
    needs: [create-release, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew Cask formula
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash scripts/release/update-homebrew-cask.sh

  publish-winget:
    name: Publish to winget
    # Submits a manifest update to microsoft/winget-pkgs for the NSIS installer, skipping when WINGET_TOKEN is unset so the workflow stays green before bootstrap.
    # The FIRST version must be submitted by hand; see scripts/release/WINGET_SETUP.md. Runs in parallel with the Homebrew job.
    needs: [create-release, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit manifest to winget-pkgs
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          # PackageIdentifier in microsoft/winget-pkgs = "<publisher>.<productName>"
          # = tauri.conf.json `publisher` (KanakKholwal) + `productName` (Recast).
          identifier: KanakKholwal.Recast
          # Tauri names the NSIS installer "Recast_<version>_x64-setup.exe".
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ needs.create-release.outputs.tag_name }}
          token: ${{ env.WINGET_TOKEN }}

      - name: Note when unconfigured
        if: ${{ env.WINGET_TOKEN == '' }}
        run: |
          echo "::notice::WINGET_TOKEN not set, skipping winget publish."
          echo "::notice::To enable, see scripts/release/WINGET_SETUP.md"
