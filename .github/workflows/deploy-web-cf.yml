name: Deploy Web to Cloudflare Workers

# A push to main deploys production; every other branch and PR deploys preview. A manual
# dispatch overrides via its environment input. Vercel (deploy-web.yml) still runs until retired.
on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web-cf.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web-cf.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: preview
        options: [preview, production]

# Serialised per ref: two pushes to main otherwise race two production deploys AND two
# db:migrate runs. In-progress runs are NOT cancelled, since a half-applied migration is worse.
concurrency:
  group: deploy-web-cf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Force wrangler to Azure Blob's node build (SAS-capable); its browser build strips SAS signing.
  WRANGLER_BUILD_PLATFORM: "node"
  WRANGLER_BUILD_CONDITIONS: "workerd,worker,import,module,node,default"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      target: ${{ steps.target.outputs.value }}
    steps:
      # main → production; any other branch or PR → preview; a manual dispatch input wins.
      - id: target
        run: echo "value=${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'preview') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4

      # Circuit breaker: without it the run fails deep inside wrangler with an error that names none of these.
      - name: Check Cloudflare prerequisites
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$(ls apps/web/wrangler.* 2>/dev/null)" ]; then
            echo "::error::apps/web/wrangler.jsonc (or .toml) is missing; wrangler deploy has nothing to read."
            missing=1
          fi
          if ! node -e "const d={...require('./apps/web/package.json').dependencies,...require('./apps/web/package.json').devDependencies};process.exit(d['@sveltejs/adapter-cloudflare']?0:1)"; then
            echo "::error::@sveltejs/adapter-cloudflare is not installed; adapter-auto cannot emit a Workers bundle in CI."
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Cloudflare deploy is not bootstrapped yet."
            exit 1
          fi
          echo "::notice::Cloudflare prerequisites satisfied; target is ${{ steps.target.outputs.value }}."

      - name: Install pnpm
        # Pinned to v4: v6 bootstraps an older pnpm then runs `pnpm self-update`, which crashes on our pinned version (pnpm/pnpm#12959).
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node >= 22.
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint --no-errors-on-unmatched apps/web
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm --filter recast-web test:unit

  deploy:
    name: Deploy (${{ needs.verify.outputs.target }})
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.verify.outputs.target }}
      url: ${{ needs.verify.outputs.target == 'production' && 'https://recast.li' || 'https://preview.recast.li' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production only, and before the deploy: migrations must be expand-only so the
      # currently-live code keeps working if the deploy below fails.
      - name: Apply DB migrations
        if: needs.verify.outputs.target == 'production'
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: pnpm --filter recast-web db:migrate

      - name: Build apps/web
        env:
          NODE_ENV: production
          PUBLIC_APP_URL: ${{ needs.verify.outputs.target == 'production' && 'https://recast.li' || 'https://preview.recast.li' }}
        run: pnpm --filter recast-web build

      # Top-level config is production; `--env preview` selects the preview worker.
      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: "4"
          command: deploy ${{ needs.verify.outputs.target == 'preview' && '--env preview' || '' }}
