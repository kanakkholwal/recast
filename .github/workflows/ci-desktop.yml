name: CI Desktop App

# Per-push compile + unit-test gate for the desktop app on all three target
# OSes. `release-desktop.yml` already builds + bundles Windows/macOS/Linux, but
# it only fires on `v*` tags — far too late to catch a change that broke a
# platform you can't run locally. This workflow compiles and runs the (OS-
# agnostic) Rust unit tests (no bundling, no signing, no FFmpeg execution) on
# every push/PR so cross-platform code stays green while it's being written.
#
# Why this is the right tool: the Linux capture stack (`pipewire`, `ashpd`,
# `x11rb`) links against system C libraries and cannot build on a Windows
# dev host; WSL can compile it but has no `xdg-desktop-portal`, so it can't
# functionally test capture either. CI is the only place both platforms
# compile continuously. Functional capture testing still needs real Linux /
# macOS hardware — that is deliberately out of scope here.

on:
  # Push is scoped to the default branch only; `pull_request` covers every other
  # branch. Running push on "**" as well caused a duplicate run whenever a commit
  # landed on a branch that also had an open PR (both `push` and `pull_request`
  # fired for the same SHA). Tag pushes (`v*`, handled by release-desktop.yml)
  # don't match a `branches` filter, so no `tags-ignore` is needed.
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/ci-desktop.yml"

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.23.0"
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FFMPEG_VERSION: "7.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check

  compile:
    name: Compile (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      # The `macos-latest` image ships several Xcode versions; the default
      # selection (16.4) has a clang resource dir that doesn't match the LLVM
      # the stable rustc was built against, so the final link fails with
      # `library 'clang_rt.osx' not found` (clang/17/lib/darwin missing).
      # Pin the newest fully-installed stable Xcode so the compiler-rt path
      # rustc emits actually exists on the runner.
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # `latest-stable` currently resolves to an Xcode RC whose toolchain is
      # missing the compiler-rt static archives rustc links (`-lclang_rt.osx`
      # → `library 'clang_rt.osx' not found`, clang/21/lib/darwin absent).
      # Rather than gamble on which Xcode the runner ships, find
      # libclang_rt.osx.a wherever it actually lives — active toolchain first,
      # then Command Line Tools, then any installed Xcode — and add its dir to
      # the linker search path so the final link resolves.
      - name: Ensure compiler-rt on link path (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rt=$(find \
            "$(xcode-select -p)/Toolchains" \
            /Library/Developer/CommandLineTools/usr/lib/clang \
            /Applications/Xcode*.app/Contents/Developer/Toolchains \
            -name 'libclang_rt.osx.a' 2>/dev/null | head -n1 || true)
          if [ -z "$rt" ]; then
            echo "::error::libclang_rt.osx.a not found; cannot satisfy -lclang_rt.osx"
            exit 1
          fi
          echo "Using compiler-rt at: $rt"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -L $(dirname "$rt")" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          key: ci-${{ matrix.platform.rust_target }}
          shared-key: ci-tauri-${{ matrix.platform.name }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-24.04'
        # Shared with release-desktop.yml. See the script for the
        # PipeWire/libspa header version trap that the PPA resolves.
        run: bash scripts/release/install-linux-deps.sh

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # `tauri::generate_context!` validates that every `externalBin` sidecar
      # exists for the target triple at macro-expansion time, so even a
      # no-bundle compile needs the files present. We never execute them in
      # CI, so empty placeholder files are enough — this skips the ~50 MB
      # FFmpeg download the release workflow does.
      - name: Create placeholder FFmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.platform.rust_target }}"
          dest="apps/desktop/src-tauri/binaries"
          mkdir -p "$dest"
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            : > "$dest/ffmpeg-$triple.exe"
            : > "$dest/ffprobe-$triple.exe"
          else
            : > "$dest/ffmpeg-$triple"
            : > "$dest/ffprobe-$triple"
            chmod +x "$dest/ffmpeg-$triple" "$dest/ffprobe-$triple"
          fi

      # Google Drive OAuth credentials (optional). Only injected when the
      # secret is present on the runner — fork PRs don't get it. Without
      # the secret, `option_env!("GOOGLE_OAUTH_CLIENT_ID")` resolves to
      # None and gdrive_connect returns "OAuth not configured" at runtime;
      # the build itself still compiles cleanly. We pass via the build
      # step's env (not a written .env file) so missing-secret runs
      # produce empty strings rather than literal "${{ ... }}" text.
      # `tauri build --no-bundle` runs the frontend build (beforeBuildCommand)
      # and a full release compile of the Rust crate, then stops before
      # producing installers — no MSIX/DMG/AppImage, no code signing, no
      # updater artifacts. That is exactly the cross-platform compile gate we
      # want: it proves the code builds on each OS without the slow, secret-
      # dependent packaging steps.
      - name: Compile desktop app (no bundle)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: pnpm --filter recast-desktop tauri build --no-bundle ${{ matrix.platform.tauri_args }}

      # Rust unit tests. The suite is OS-agnostic (pure functions: filter-graph
      # construction, zoom-expression budgeting, blur-radius clamping per plane,
      # cursor/scale math, the combinatorial export-option matrices) — but we
      # run it on every target so a test that accidentally depends on a platform
      # is caught here too. `--lib` matches the local `test:rust` script (library
      # target only — no integration tests spawn FFmpeg). `--release` plus the
      # same `tauri_args` target reuses the artifacts the compile step just
      # built, so this is the test-harness compile + run, not a fresh build.
      # Deliberately no `continue-on-error`: a failing test must fail the build.
      - name: Run Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --release ${{ matrix.platform.tauri_args }}

      # Clippy after the build so the compile gate above is the hard failure
      # signal; lint findings surface here without blocking until the team
      # decides to make them blocking (drop `continue-on-error` then).
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --target ${{ matrix.platform.rust_target }}
