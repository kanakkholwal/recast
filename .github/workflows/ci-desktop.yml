name: CI Desktop App


on:

  push:
    branches:
      - main
   
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/ci-desktop.yml"

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FFMPEG_VERSION: "7.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | grep -oE '"[^"]+"' | tr -d '"')
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      # The engine is its own workspace, so the line above never reached it.
      - name: Check formatting (engine crates)
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

  lint:
    name: biome + comment rule
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Resolve base ref
        id: base
        run: |
          base="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git fetch --no-tags --depth=0 origin "$base"
          echo "ref=origin/$base" >> "$GITHUB_OUTPUT"
      # - name: Biome lint (changed)
      #   run: pnpm exec biome lint --changed --since=${{ steps.base.outputs.ref }} --no-errors-on-unmatched .
      - name: Comment rule (changed)
        run: node scripts/check-comments.mjs --since=${{ steps.base.outputs.ref }}

  ui-tests:
    name: desktop UI unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v4  # pnpm version comes from the root package.json `packageManager`
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
    
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Shared package unit tests
        run: pnpm test:captions && pnpm test:media && pnpm test:editor && pnpm test:player && pnpm test:render && pnpm test:application
      - name: Desktop UI unit tests
        run: pnpm test:desktop
     
      - name: Verify every package declares a real check
        run: node scripts/verify-package-scripts.mjs
      - name: Typecheck shared packages
        run: pnpm --filter "./packages/*" check
      - name: Typecheck desktop frontend (svelte-check)
        run: pnpm --filter recast-desktop check

  compile:
    name: Compile (${{ matrix.platform.name }})

    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          # Intel Mac, CROSS-COMPILED on the arm64 runner (`--target
          # x86_64-apple-darwin`). GitHub is retiring the native Intel image
          # (macos-13), whose runners queue for hours, so we build x86_64 on the
          # plentiful arm64 runner instead. This proves the on-device engine (ggml
          # / transcribe.cpp) compiles for x86_64 (the old `ort` had no such
          # build). `cross: true` skips the test RUN below (an x86_64 binary can't
          # run on arm64 without Rosetta); the OS-agnostic tests already run on the
          # macos-arm64 leg, so this stays a pure compile gate.
          - name: macos-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            cross: true
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
    runs-on: ${{ matrix.platform.os }}
    # The Windows leg measured ~50 min with a warm cache; this is headroom for
    # a cold one without letting a hung linker hold a runner for six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

 
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

     
      - name: Install pnpm

        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

    
      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: |
          channel=$(grep -m1 -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | grep -oE '"[^"]+"' | tr -d '"')
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.platform.rust_target }}
          components: clippy

      # BOTH workspaces. `crates/` was never cached, so every run rebuilt the
      # whole engine tree (wgpu and friends) from scratch three times over —
      # `Engine crates`, `capturekit backends` and `Clippy (engine crates)`.
      # `shared-key` alone: it replaces the automatic job key, so pairing it
      # with `key` only made the entry harder to hit.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./apps/desktop/src-tauri -> target
            ./crates -> target
          shared-key: ci-${{ matrix.platform.rust_target }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-24.04'
        # Shared with release-desktop.yml. See the script for the
        # PipeWire/libspa header version trap that the PPA resolves.
        run: bash scripts/release/install-linux-deps.sh

      # The on-device engine (transcribe.cpp) compiles ggml from source, so it
      # needs CMake + a C/C++ compiler. macOS/Windows runners ship them; ensure
      # CMake on Linux. (ggml is vendored in-tree, so no submodule checkout.)
      - name: Ensure CMake (Linux)
        if: matrix.platform.os == 'ubuntu-24.04'
        run: sudo apt-get install -y cmake

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

     
      - name: Cache FFmpeg sidecars
        id: ffmpeg-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: apps/desktop/src-tauri/binaries
          key: ci-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.platform.rust_target }}
          # A restore key is a PREFIX. The old fallback was the exact key plus a
          # trailing dash, which is longer than the key and so never matched.
          restore-keys: |
            ci-ffmpeg-${{ env.FFMPEG_VERSION }}-
      - name: Download FFmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        # Explicit `bash <file>` instead of `./<file>` — the dispatch shell
        # script isn't necessarily +x on a Windows-checkout working tree,
        # and the per-OS dispatchees (`download-ffmpeg-{windows,macos,linux}.*`)
        # are always invoked via `bash`/`pwsh` explicitly for the same reason.
        run: bash ./scripts/release/ensure-ffmpeg.sh '${{ matrix.platform.rust_target }}' 'apps/desktop/src-tauri/binaries'

     
      - name: Compile desktop app (no bundle)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          TRANSCRIBE_CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
        run: pnpm --filter recast-desktop tauri build --no-bundle ${{ matrix.platform.tauri_args }}

      # Smoke test — drives the built binary through real ggml inference
      # and asserts no STATUS_ILLEGAL_INSTRUCTION / native abort fires.
      #
      # Cache + script instead of three separate prep steps. The cache
      # key is shared with release-desktop.yml so a clean cache hit on
      # CI is also a clean cache hit on release. The script itself is
      # self-contained (handles platform detection, GGUF download with
      # sanity-size floor, WAV synth, OS-conditional invocation, WER
      # post-mortem scan); no other step prepares inputs for it.
      #
      # `cross: true` legs (macos-x64 cross-compiled on arm64) skip — the
      # x86_64 binary can't execute on the arm64 host.
      - name: Cache smoke-test GGUF (Whisper-base, ~60 MB)
        if: ${{ !matrix.platform.cross }}
        uses: actions/cache@v6
        with:
          path: models-cache/smoke-test
          key: smoke-gguf-${{ matrix.platform.rust_target }}-whisper-base-Q5_K_M
          restore-keys: |
            smoke-gguf-${{ matrix.platform.rust_target }}-
      - name: Smoke test — ggml inference (${{ matrix.platform.name }})
        if: ${{ !matrix.platform.cross }}
        shell: pwsh
        run: ./scripts/release/smoke-test-transcription.ps1

     
      - name: Run Rust unit tests
        if: ${{ !matrix.platform.cross }}
        env:
          # Must match the compile step above, or cargo rebuilds every
          # dependency at the other setting instead of reusing them.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --release ${{ matrix.platform.tauri_args }}

     
      - name: Engine crates
        if: ${{ !matrix.platform.cross }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
        run: cargo test --manifest-path crates/Cargo.toml --workspace --release

    
      - name: capturekit backends (${{ matrix.platform.name }})
        if: ${{ !matrix.platform.cross }}
        run: |
          cargo clippy --manifest-path crates/Cargo.toml -p capturekit -p capturekit-core --all-targets --all-features --release -- -D warnings
          cargo test --manifest-path crates/Cargo.toml -p capturekit-core --all-features --release

    
      # Every platform, not just Windows: the Linux portal stack is what sets the
      # floor, so a Windows-only gate let a false 1.81 claim stand.
      - name: capturekit MSRV (1.88)
        if: ${{ !matrix.platform.cross }}
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --manifest-path crates/Cargo.toml -p capturekit -p capturekit-core --all-features

     
      - name: capturekit live capture (Windows only)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        env:
          CAPTUREKIT_REQUIRE_DESKTOP: "1"
        run: cargo test --manifest-path crates/Cargo.toml -p capturekit --all-features --release

      - name: Engine crates compile to wasm32
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/Cargo.toml --target wasm32-unknown-unknown -p recast-ffi-wasm -p recast-compositor -p recast-scene -p recast-color -p recast-cursor -p recast-time -p recast-audio

     
      - name: Clippy (wasm32)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: cargo clippy --manifest-path crates/Cargo.toml --target wasm32-unknown-unknown -p recast-ffi-wasm -- -D warnings


      - name: Preview engine artifacts
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: |
          pnpm --filter @recast/engine build
          test -z "$(git status --porcelain -- packages/engine/wasm)"

      - name: Engine golden frames (browser build)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: |
          pnpm --filter @recast/engine exec playwright install --with-deps chromium
          pnpm --filter @recast/engine test:golden

    
      - name: Export golden frames (Windows only)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test golden_frames


      # `--lib` above skips integration targets, so these two only ever ran by
      # hand. Parity is the one gate on the FFmpeg and engine renderers agreeing;
      # nothing else catches them drifting apart.
      - name: Engine parity + perf baseline (Windows only)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test engine_parity
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test perf_baseline


      - name: Clippy
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --release ${{ matrix.platform.tauri_args }} -- -D warnings

    
      - name: Clippy (engine crates)
        if: ${{ !matrix.platform.cross }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --release -- -D warnings
