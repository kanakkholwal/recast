name: CI Desktop App

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/ci-desktop.yml"

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FFMPEG_VERSION: "7.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Cheap gates first, so the four compile legs never start on a run that has already failed.
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: rust
        run: bash scripts/ci/read-toolchain.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Repo-wide, not --changed: the repo is clean at error level, so a PR can never
      # inherit a failure from a file it did not touch, and debt cannot creep in unlinted.
      # Each gate reports independently: one failure must not hide the next.
      - name: rustfmt (desktop)
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - name: rustfmt (engine crates)
        if: ${{ !cancelled() }}
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check
      - name: Biome lint
        if: ${{ !cancelled() }}
        run: pnpm exec biome lint --no-errors-on-unmatched .
      - name: Biome format
        if: ${{ !cancelled() }}
        run: pnpm exec biome format --no-errors-on-unmatched .
      - name: Comment rule
        if: ${{ !cancelled() }}
        run: node scripts/check-comments.mjs --all

  ui-tests:
    name: UI unit tests + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` chains every suite; turbo reports all failures rather than stopping at the first.
      - name: Package + desktop unit tests
        run: pnpm test:captions && pnpm test:media && pnpm test:editor && pnpm test:player && pnpm test:render && pnpm test:application && pnpm test:desktop

      - name: Verify every package declares a real check
        if: ${{ !cancelled() }}
        run: node scripts/verify-package-scripts.mjs
      - name: Typecheck workspace
        if: ${{ !cancelled() }}
        run: pnpm --filter "./packages/*" check && pnpm --filter recast-desktop check

  # OS-independent gates, hoisted off the four compile legs where they ran 3x over.
  engine:
    name: engine crates + wasm
    needs: [quality]
    runs-on: ubuntu-24.04
    # Three cold compilation passes over 17 crates: wasm32 build, release clippy --all-targets, and an MSRV check on a second toolchain.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: rust
        run: bash scripts/ci/read-toolchain.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./crates -> target
          shared-key: ci-engine-linux
          cache-on-failure: true
      - name: Setup build environment
        run: bash scripts/ci/setup-build-env.sh

      - name: Engine crates compile to wasm32
        run: cargo build --manifest-path crates/Cargo.toml --target wasm32-unknown-unknown -p recast-ffi-wasm -p recast-compositor -p recast-scene -p recast-color -p recast-cursor -p recast-time -p recast-audio
      - name: Clippy (wasm32)
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path crates/Cargo.toml --target wasm32-unknown-unknown -p recast-ffi-wasm -- -D warnings
      - name: Clippy (engine crates)
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --release -- -D warnings
      # The Linux portal stack sets the floor, so this must not be Windows-only: a Windows-only gate let a false 1.81 claim stand.
      - name: capturekit MSRV (1.88)
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 check --manifest-path crates/Cargo.toml -p capturekit -p capturekit-core --all-features

  compile:
    name: Compile (${{ matrix.platform.name }})
    needs: [quality, ui-tests]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          # Intel Mac, cross-compiled on the arm64 runner because GitHub is retiring the native macos-13 image and its runners queue for hours.
          # `cross: true` skips every RUN step below, since an x86_64 binary cannot execute on an arm64 host.
          - name: macos-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            cross: true
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
    runs-on: ${{ matrix.platform.os }}
    # The Windows leg measured ~50 min warm; this is headroom for a cold cache without letting a hung linker hold a runner for six hours.
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      TRANSCRIBE_CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
      CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Read pinned toolchain
        id: rust
        shell: bash
        run: bash scripts/ci/read-toolchain.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.platform.rust_target }}
          components: clippy

      # BOTH workspaces: `crates/` was never cached, so every run rebuilt the whole engine tree.
      # `shared-key` alone, since it replaces the automatic job key and pairing it with `key` only made the entry harder to hit.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./apps/desktop/src-tauri -> target
            ./crates -> target
          shared-key: ci-${{ matrix.platform.rust_target }}
          cache-on-failure: true

      - name: Setup build environment
        shell: bash
        run: bash scripts/ci/setup-build-env.sh

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache FFmpeg sidecars
        id: ffmpeg-cache
        # A flaky restore must not sink the leg: on a cache error `cache-hit` stays falsy and the download step runs.
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: ci-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.platform.rust_target }}
          # A restore key is a PREFIX; the old fallback was the exact key plus a dash, which is longer than the key and so never matched.
          restore-keys: |
            ci-ffmpeg-${{ env.FFMPEG_VERSION }}-
      - name: Download FFmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        # `bash <file>`, not `./<file>`: the script is not necessarily +x on a Windows checkout.
        run: bash ./scripts/release/ensure-ffmpeg.sh '${{ matrix.platform.rust_target }}' 'apps/desktop/src-tauri/binaries'

      - name: Compile desktop app (no bundle)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: pnpm --filter recast-desktop tauri build --no-bundle ${{ matrix.platform.tauri_args }}

      - name: Cache smoke-test GGUF (Whisper-base, ~60 MB)
        if: ${{ !matrix.platform.cross }}
        uses: actions/cache@v4
        with:
          path: models-cache/smoke-test
          key: smoke-gguf-${{ matrix.platform.rust_target }}-whisper-base-Q5_K_M
          restore-keys: |
            smoke-gguf-${{ matrix.platform.rust_target }}-
      # Drives the built binary through real ggml inference, asserting no illegal-instruction or native abort fires.
      - name: Smoke test — ggml inference
        if: ${{ !matrix.platform.cross }}
        shell: pwsh
        run: ./scripts/release/smoke-test-transcription.ps1

      # `!cancelled()` on each: a failing test must not hide the clippy result behind it.
      - name: Rust unit tests
        if: ${{ !matrix.platform.cross && !cancelled() }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --release ${{ matrix.platform.tauri_args }}
      # Without a driver the Linux runner has no adapter at all, so every wgpu
      # test skips and the compute shader ships never having run on Vulkan.
      # lavapipe is a software rasteriser: correct, and far too slow to compare.
      - name: Software Vulkan adapter (Linux)
        if: ${{ matrix.platform.name == 'linux-x64' && !cancelled() }}
        run: sudo apt-get install -y mesa-vulkan-drivers

      - name: Engine crates
        if: ${{ !matrix.platform.cross && !cancelled() }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
          # A missing adapter skips every GPU test silently, which reads as green on
          # a runner that never dispatched the shader. D3D12/WARP, Metal, lavapipe.
          RECAST_REQUIRE_GPU: "1"
        run: cargo test --manifest-path crates/Cargo.toml --workspace --release

      # Reported, never gated: a hosted runner's GPU is not the machine anyone
      # exports on, so only the shape of the numbers per OS is meaningful.
      - name: Engine benchmarks (${{ matrix.platform.name }})
        if: ${{ !matrix.platform.cross && !cancelled() }}
        shell: bash
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
          RECAST_REQUIRE_GPU: "1"
        run: |
          set -o pipefail
          cargo test --manifest-path crates/Cargo.toml -p recast-export --release             --test perf_probe -- --ignored --nocapture | tee bench.txt
          {
            echo "### Engine benchmarks: ${{ matrix.platform.name }}"
            echo
            echo "| measurement | case | ms/frame |"
            echo "| --- | --- | --- |"
            grep '^bench|' bench.txt | awk -F'|' '{ print "| " $2 " | " $3 " | " $4 " |" }'
            echo
            echo "Reported, not gated. Hosted-runner GPUs vary too much between runs to compare across machines."
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^bench|' bench.txt; then
            echo "the benchmark produced no rows: the probes skipped" >&2
            exit 1
          fi
      - name: capturekit backends
        if: ${{ !matrix.platform.cross && !cancelled() }}
        run: |
          cargo clippy --manifest-path crates/Cargo.toml -p capturekit -p capturekit-core --all-targets --all-features --release -- -D warnings
          cargo test --manifest-path crates/Cargo.toml -p capturekit-core --all-features --release
      - name: Clippy (desktop)
        if: ${{ !cancelled() }}
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --release ${{ matrix.platform.tauri_args }} -- -D warnings

      # Windows is the only runner with a real desktop session and the GPU path these exercise.
      - name: capturekit live capture
        if: ${{ matrix.platform.name == 'windows-x64' && !cancelled() }}
        env:
          CAPTUREKIT_REQUIRE_DESKTOP: "1"
        run: cargo test --manifest-path crates/Cargo.toml -p capturekit --all-features --release
      - name: Preview engine artifacts are committed
        if: ${{ matrix.platform.name == 'windows-x64' && !cancelled() }}
        shell: bash
        run: |
          pnpm --filter @recast/engine build
          test -z "$(git status --porcelain -- packages/engine/wasm)"
      - name: Engine golden frames (browser build)
        if: ${{ matrix.platform.name == 'windows-x64' && !cancelled() }}
        run: |
          pnpm --filter @recast/engine exec playwright install --with-deps chromium
          pnpm --filter @recast/engine test:golden
      # `--lib` above skips integration targets, so these never ran in CI.
      - name: Golden frames + parity + perf
        if: ${{ matrix.platform.name == 'windows-x64' && !cancelled() }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test golden_frames
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test engine_parity
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test perf_baseline
