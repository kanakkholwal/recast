name: CI Desktop App

# Per-push compile + unit-test gate for the desktop app on all three target
# OSes. `release-desktop.yml` already builds + bundles Windows/macOS/Linux, but
# it only fires on `v*` tags — far too late to catch a change that broke a
# platform you can't run locally. This workflow compiles and runs the (OS-
# agnostic) Rust unit tests (no bundling, no signing, no FFmpeg execution) on
# every push/PR so cross-platform code stays green while it's being written.
#
# Why this is the right tool: the Linux capture stack (`pipewire`, `ashpd`,
# `x11rb`) links against system C libraries and cannot build on a Windows
# dev host; WSL can compile it but has no `xdg-desktop-portal`, so it can't
# functionally test capture either. CI is the only place both platforms
# compile continuously. Functional capture testing still needs real Linux /
# macOS hardware — that is deliberately out of scope here.

on:
  # Push is scoped to the default branch only; `pull_request` covers every other
  # branch. Running push on "**" as well caused a duplicate run whenever a commit
  # landed on a branch that also had an open PR (both `push` and `pull_request`
  # fired for the same SHA). Tag pushes (`v*`, handled by release-desktop.yml)
  # don't match a `branches` filter, so no `tags-ignore` is needed.
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/ci-desktop.yml"

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FFMPEG_VERSION: "7.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check

  # Desktop UI unit tests (the extracted pure `.logic.ts` modules: timeline math,
  # cursor animation, export options, etc.). OS-agnostic and Rust-free, so they
  # run once on Linux rather than across the compile matrix. Nothing ran them in
  # CI before this job existed. Web tests live in deploy-web.yml, which is the
  # workflow whose path filter actually fires on a web change.
  ui-tests:
    name: desktop UI unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from the root package.json `packageManager` field.
      # Do NOT pin it here: a hardcoded version silently drifted CI onto pnpm 10
      # while the repo had moved to 11.
      - name: Install pnpm
        # Pinned to v4 on purpose: v6 bootstraps an older pnpm and then runs `pnpm
        # self-update`, which crashes on our pinned 11.12.0 (pnpm/pnpm#12959). v4
        # installs the pinned version directly and never takes that path.
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      # `prepare` (svelte-kit sync) runs on install, generating the `.svelte-kit`
      # types svelte-check needs below.
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Shared package unit tests
        run: pnpm test:captions && pnpm test:media && pnpm test:editor && pnpm test:player && pnpm test:render && pnpm test:application
      - name: Desktop UI unit tests
        run: pnpm test:desktop
      # Typecheck the Svelte/TS half. Fails on ERRORS only (warnings are reported
      # but don't block), matching the local `pnpm check` gate. Catches the class
      # of break the vitest suite can't: a bad prop/event type or a component
      # that no longer compiles.
      # `pnpm --filter` silently skips a package with no `check` script, so the
      # guard runs first — that gap is how ~16k LOC went unverified.
      - name: Verify every package declares a real check
        run: node scripts/verify-package-scripts.mjs
      - name: Typecheck shared packages
        run: pnpm --filter "./packages/*" check
      - name: Typecheck desktop frontend (svelte-check)
        run: pnpm --filter recast-desktop check

  compile:
    name: Compile (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          # Intel Mac, CROSS-COMPILED on the arm64 runner (`--target
          # x86_64-apple-darwin`). GitHub is retiring the native Intel image
          # (macos-13), whose runners queue for hours, so we build x86_64 on the
          # plentiful arm64 runner instead. This proves the on-device engine (ggml
          # / transcribe.cpp) compiles for x86_64 (the old `ort` had no such
          # build). `cross: true` skips the test RUN below (an x86_64 binary can't
          # run on arm64 without Rosetta); the OS-agnostic tests already run on the
          # macos-arm64 leg, so this stays a pure compile gate.
          - name: macos-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            cross: true
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: ""
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v6

      # The `macos-latest` image ships several Xcode versions; the default
      # selection (16.4) has a clang resource dir that doesn't match the LLVM
      # the stable rustc was built against, so the final link fails with
      # `library 'clang_rt.osx' not found` (clang/17/lib/darwin missing).
      # Pin the newest fully-installed stable Xcode so the compiler-rt path
      # rustc emits actually exists on the runner.
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # `latest-stable` currently resolves to an Xcode RC whose toolchain is
      # missing the compiler-rt static archives rustc links (`-lclang_rt.osx`
      # → `library 'clang_rt.osx' not found`, clang/21/lib/darwin absent).
      # Rather than gamble on which Xcode the runner ships, find
      # libclang_rt.osx.a wherever it actually lives — active toolchain first,
      # then Command Line Tools, then any installed Xcode — and add its dir to
      # the linker search path so the final link resolves.
      - name: Ensure compiler-rt on link path (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rt=$(find \
            "$(xcode-select -p)/Toolchains" \
            /Library/Developer/CommandLineTools/usr/lib/clang \
            /Applications/Xcode*.app/Contents/Developer/Toolchains \
            -name 'libclang_rt.osx.a' 2>/dev/null | head -n1 || true)
          if [ -z "$rt" ]; then
            echo "::error::libclang_rt.osx.a not found; cannot satisfy -lclang_rt.osx"
            exit 1
          fi
          echo "Using compiler-rt at: $rt"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -L $(dirname "$rt")" >> "$GITHUB_ENV"

      # pnpm version comes from the root package.json `packageManager` field.
      # Do NOT pin it here: a hardcoded version silently drifted CI onto pnpm 10
      # while the repo had moved to 11.
      - name: Install pnpm
        # Pinned to v4 on purpose: v6 bootstraps an older pnpm and then runs `pnpm
        # self-update`, which crashes on our pinned 11.12.0 (pnpm/pnpm#12959). v4
        # installs the pinned version directly and never takes that path.
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          key: ci-${{ matrix.platform.rust_target }}
          shared-key: ci-tauri-${{ matrix.platform.name }}
          cache-on-failure: true

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-24.04'
        # Shared with release-desktop.yml. See the script for the
        # PipeWire/libspa header version trap that the PPA resolves.
        run: bash scripts/release/install-linux-deps.sh

      # The on-device engine (transcribe.cpp) compiles ggml from source, so it
      # needs CMake + a C/C++ compiler. macOS/Windows runners ship them; ensure
      # CMake on Linux. (ggml is vendored in-tree, so no submodule checkout.)
      - name: Ensure CMake (Linux)
        if: matrix.platform.os == 'ubuntu-24.04'
        run: sudo apt-get install -y cmake

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # `tauri::generate_context!` validates that every `externalBin` sidecar
      # exists at macro-expansion time. We need a REAL ffmpeg binary at that
      # path (not an empty placeholder) so the smoke test can actually decode
      # audio and reach `Session::run` — the placeholder was a hack that
      # compiled fine but 0-byte files make Windows return error 193
      # (`%1 is not a valid Win32 application`) when recast spawns them.
      #
      # One cache step + one dispatch step replaces three per-OS branches.
      # The dispatch (`scripts/release/ensure-ffmpeg.sh`) reads `$RUNNER_OS`
      # and routes to the matching downloader — Windows uses `pwsh` for the
      # gyan.dev essentials zip extraction.
      - name: Cache FFmpeg sidecars
        id: ffmpeg-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: apps/desktop/src-tauri/binaries
          key: ci-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.platform.rust_target }}
          restore-keys: |
            ci-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ matrix.platform.rust_target }}-
      - name: Download FFmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        # Explicit `bash <file>` instead of `./<file>` — the dispatch shell
        # script isn't necessarily +x on a Windows-checkout working tree,
        # and the per-OS dispatchees (`download-ffmpeg-{windows,macos,linux}.*`)
        # are always invoked via `bash`/`pwsh` explicitly for the same reason.
        run: bash ./scripts/release/ensure-ffmpeg.sh '${{ matrix.platform.rust_target }}' 'apps/desktop/src-tauri/binaries'

      # Google Drive OAuth credentials (optional). Only injected when the
      # secret is present on the runner — fork PRs don't get it. Without
      # the secret, `option_env!("GOOGLE_OAUTH_CLIENT_ID")` resolves to
      # None and gdrive_connect returns "OAuth not configured" at runtime;
      # the build itself still compiles cleanly. We pass via the build
      # step's env (not a written .env file) so missing-secret runs
      # produce empty strings rather than literal "${{ ... }}" text.
      # `tauri build --no-bundle` runs the frontend build (beforeBuildCommand)
      # and a full release compile of the Rust crate, then stops before
      # producing installers — no MSIX/DMG/AppImage, no code signing, no
      # updater artifacts. That is exactly the cross-platform compile gate we
      # want: it proves the code builds on each OS without the slow, secret-
      # dependent packaging steps.
      #
      # Force portable x64 ggml. CI runners are Intel Xeon with AVX-512;
      # without this flag the staticlib compiles in an AVX-512 jump-table
      # which raises STATUS_ILLEGAL_INSTRUCTION (0xC000001D) on Zen 3 /
      # pre-Skylake / VM CPUs (real users). Scalar fallback is ~14x slower
      # but works on every x86_64 CPU. Same flag is lifted into
      # release-desktop.yml. The `CMAKE_ARGS` mirror is belt-and-braces
      # because the sys build.rs reads both.
      - name: Compile desktop app (no bundle)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TRANSCRIBE_CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=OFF -DGGML_OPENMP=OFF"
        run: pnpm --filter recast-desktop tauri build --no-bundle ${{ matrix.platform.tauri_args }}

      # Smoke test — drives the built binary through real ggml inference
      # and asserts no STATUS_ILLEGAL_INSTRUCTION / native abort fires.
      #
      # Cache + script instead of three separate prep steps. The cache
      # key is shared with release-desktop.yml so a clean cache hit on
      # CI is also a clean cache hit on release. The script itself is
      # self-contained (handles platform detection, GGUF download with
      # sanity-size floor, WAV synth, OS-conditional invocation, WER
      # post-mortem scan); no other step prepares inputs for it.
      #
      # `cross: true` legs (macos-x64 cross-compiled on arm64) skip — the
      # x86_64 binary can't execute on the arm64 host.
      - name: Cache smoke-test GGUF (Whisper-base, ~60 MB)
        if: ${{ !matrix.platform.cross }}
        uses: actions/cache@v6
        with:
          path: models-cache/smoke-test
          key: smoke-gguf-${{ matrix.platform.rust_target }}-whisper-base-Q5_K_M
          restore-keys: |
            smoke-gguf-${{ matrix.platform.rust_target }}-
      - name: Smoke test — ggml inference (${{ matrix.platform.name }})
        if: ${{ !matrix.platform.cross }}
        shell: pwsh
        run: ./scripts/release/smoke-test-transcription.ps1

      # Rust unit tests. Most of the suite is OS-agnostic (pure functions:
      # filter-graph construction, zoom-expression budgeting, blur-radius
      # clamping per plane, cursor/scale math, the combinatorial export-option
      # matrices), but the matrix is also the ONLY place the `cfg`-gated platform
      # tests execute at all: the X11 capture-rect contract (source-not-crop),
      # the Linux mic pulse/ALSA fallback, the camera mode fallback, the
      # macOS/Linux ffmpeg install-dir probe, and the system-audio
      # `is_capturing` split each compile on one OS only. A Windows dev host
      # cannot build or run them — that is exactly why they are gated here.
      # `--lib` matches the local `test:rust` script (library target only — no
      # integration tests spawn FFmpeg). `--release` plus the same `tauri_args`
      # target reuses the artifacts the compile step just built, so this is the
      # test-harness compile + run, not a fresh build.
      # Deliberately no `continue-on-error`: a failing test must fail the build.
      # Skipped on the cross-compiled Intel leg (`cross: true`): its x86_64 test
      # binary can't run on the arm64 host, and the same tests already run on the
      # macos-arm64 leg.
      #
      # Default features cover both on-device engines (ggml captions, ocrs OCR), so
      # the OCR suite (sampler gate, span collapsing, model URLs) runs here with no
      # extra flag, and the compile above proves the pure-Rust ocrs/rten stack
      # builds on all three targets. The FFmpeg-dependent end-to-end OCR harness is
      # `#[ignore]`d, so this stays hermetic.
      - name: Run Rust unit tests
        if: ${{ !matrix.platform.cross }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --release ${{ matrix.platform.tauri_args }}

      # The sync harness is the first test in this repo that decodes real frames
      # and samples. Encode/decode timing bugs (frame drops, A/V drift, wrong
      # duration) are invisible to every other suite here. Uses the sidecars
      # downloaded above, so it costs no extra setup.
      - name: Engine crates
        if: ${{ !matrix.platform.cross }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
        run: cargo test --manifest-path crates/Cargo.toml --workspace --release

      # The compositor and its leaf crates MUST keep compiling to wasm32: the
      # whole plan rests on one compositor serving native and the browser
      # preview. A dependency that pulls in std::fs or tokio breaks this and
      # nothing else would notice until the preview cutover.
      - name: Engine crates compile to wasm32
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/Cargo.toml --target wasm32-unknown-unknown -p recast-ffi-wasm -p recast-compositor -p recast-scene -p recast-color -p recast-time

      # The native clippy step below never sees `preview.rs`, which is the whole
      # wasm surface.
      - name: Clippy (wasm32)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: cargo clippy --manifest-path crates/Cargo.toml --target wasm32-unknown-unknown -p recast-ffi-wasm -- -D warnings

      # Proves the wasm-bindgen surface still builds, and that every build
      # product it emits is ignored rather than landing in the tree.
      - name: Preview engine artifacts
        if: ${{ matrix.platform.name == 'windows-x64' }}
        run: |
          pnpm --filter @recast/engine build
          test -z "$(git status --porcelain -- packages/engine/wasm)"

      # Golden frames pin what the CURRENT export compositor renders, so the wgpu
      # rewrite has an exact target. Windows only: the fixtures are byte-compared,
      # and a different FFmpeg build / libx264 version / scaler rounding on another
      # OS shifts pixels past the tolerance for reasons that are not regressions.
      - name: Export golden frames (Windows only)
        if: ${{ matrix.platform.name == 'windows-x64' }}
        env:
          RECAST_TESTKIT_REQUIRE_FFMPEG: "1"
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test golden_frames

      # Clippy after the build so the compile gate above is the hard failure
      # signal; lint findings surface here without blocking until the team
      # decides to make them blocking (drop `continue-on-error` then).
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --target ${{ matrix.platform.rust_target }}

      # The engine crates are new code held to a stricter bar than the app, so
      # this one blocks.
      - name: Clippy (engine crates)
        if: ${{ !matrix.platform.cross }}
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings
