[package]
name = "recast-scene"
version = "0.0.0"
edition = "2021"
publish = false
description = "The typed, versioned scene graph plus the v1 RenderState reader that migrates into it."

[dependencies]
recast-color = { path = "../recast-color" }
recast-time = { path = "../recast-time", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
