[package]
name = "recast-compositor"
version = "0.0.0"
edition = "2021"
publish = false
description = "The frame graph, the pure scene-to-uniforms evaluator, and the WGSL passes."

[dependencies]
recast-gpu = { path = "../recast-gpu" }
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1.19", features = ["derive"] }
recast-color = { path = "../recast-color" }
recast-cursor = { path = "../recast-cursor" }
recast-scene = { path = "../recast-scene" }
recast-time = { path = "../recast-time", default-features = false, features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.151"
