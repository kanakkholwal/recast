[package]
name = "capturekit-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Vocabulary types for capturekit: pixel formats, geometry, colour, timestamps and errors."
repository = "https://github.com/kanakkholwal/capturekit"
keywords = ["screen-capture", "screenshot", "video", "pixel-format"]
categories = ["multimedia::video", "graphics", "os"]
# Flipped on when the API is settled and the name is reserved.
publish = false

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.12"

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
