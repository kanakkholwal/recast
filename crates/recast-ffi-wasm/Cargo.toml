[package]
name = "recast-ffi-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "wasm-bindgen surface over the compositor: marshalling and lifecycle only, no logic."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu", "webgl2"]
webgpu = ["wgpu/webgpu", "recast-gpu/webgpu"]
webgl2 = ["wgpu/webgl", "recast-gpu/webgl2"]

[dependencies]
recast-compositor = { path = "../recast-compositor" }
recast-cursor = { path = "../recast-cursor" }
recast-gpu = { path = "../recast-gpu" }
recast-scene = { path = "../recast-scene" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "ImageBitmap",
    "OffscreenCanvas",
    "VideoFrame",
] }
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
