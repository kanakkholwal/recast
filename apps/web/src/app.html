<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<link rel="icon" href="/favicon.ico" />

	<!-- Initial splash — pure HTML/CSS so it paints instantly on a hard load,
	     before any bundle runs, covering the hydration gap on product routes.
	     The root layout fades + removes it once hydrated (see +layout.svelte).
	     Colours use prefers-color-scheme since the app theme class isn't set
	     this early; a brief mismatch (if the user forced a non-system theme)
	     resolves the moment the app hydrates. -->
	<style>
		#app-splash {
			position: fixed;
			inset: 0;
			z-index: 2147483000;
			display: none;
			align-items: center;
			justify-content: center;
			background: #ffffff;
			opacity: 1;
			transition: opacity 320ms ease;
		}
		html.splash-active #app-splash { display: flex; }
		html.splash-active.splash-hydrated #app-splash {
			opacity: 0;
			pointer-events: none;
		}
		#app-splash .app-splash-mark {
			position: relative;
			display: grid;
			place-items: center;
			width: 64px;
			height: 64px;
			border-radius: 18px;
			background: #0b0b0b;
			color: #ffffff;
			box-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.28);
			animation: app-splash-pulse 1.5s ease-in-out infinite;
		}
		#app-splash svg { width: 34px; height: 34px; display: block; }
		@media (prefers-color-scheme: dark) {
			#app-splash { background: #0a0a0a; }
			#app-splash .app-splash-mark {
				background: #fafafa;
				color: #0a0a0a;
				box-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.6);
			}
		}
		@keyframes app-splash-pulse {
			0%, 100% { transform: scale(1); }
			50% { transform: scale(1.07); }
		}
		@media (prefers-reduced-motion: reduce) {
			#app-splash .app-splash-mark { animation: none; }
		}
	</style>
	<script>
		// Only arm the splash on product surfaces (mirror of isAppArea in
		// routes/layout.logic.ts — keep the two in sync). Runs before body paint
		// so marketing pages never flash it.
		(function () {
			try {
				var p = location.pathname;
				if (p.indexOf("/dashboard") !== 0 && p.indexOf("/share/") !== 0) return;
				var root = document.documentElement;
				root.classList.add("splash-active");
				// Safety net: if hydration never runs (bundle error, dead network),
				// retire the splash anyway so the viewer is never stuck on it.
				setTimeout(function () {
					var el = document.getElementById("app-splash");
					if (!el) return;
					root.classList.add("splash-hydrated");
					setTimeout(function () {
						if (el) el.remove();
					}, 400);
				}, 10000);
			} catch (e) {}
		})();
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">

	<div style="display: contents">%sveltekit.body%</div>

	<div id="app-splash" aria-hidden="true">
		<span class="app-splash-mark">

				<path d="M311.28 311.6H331.28" stroke="currentColor" stroke-width="6" stroke-linecap="round" />

			</svg>
		</span>
	</div>
</body>

</html>
