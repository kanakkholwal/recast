<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<link rel="icon" href="/favicon.ico" />

	<script>
		// Resolve the stored theme before first paint. Without this the splash (and
		// then every page) painted light until ModeWatcher mounted, so anyone on a
		// forced dark theme got a white flash on every hard load. Mirrors
		// apps/desktop/src/app.html; `mode-watcher-mode` is ModeWatcher's key.
		(() => {
			try {
				const stored = localStorage.getItem("mode-watcher-mode");
				const prefersDark =
					window.matchMedia?.("(prefers-color-scheme: dark)").matches;
				const resolved = stored && stored !== "system" ? stored : prefersDark ? "dark" : "light";
				const root = document.documentElement;
				if (resolved === "dark") {
					root.classList.add("dark");
					root.setAttribute("data-theme", "dark");
				} else {
					root.setAttribute("data-theme", "light");
				}
			} catch (_) {
				// Storage can be unavailable in private mode; the OS preference still applies.
			}
		})();
	</script>

	<!-- Initial splash — pure HTML/CSS so it paints instantly on a hard load,
	     before any bundle runs, covering the hydration gap on product routes.
	     The root layout fades + removes it once hydrated (see +layout.svelte).
	     Same plate/mark/shimmer language as the desktop boot screen and
	     <AppLoading>; colours are literal because app.css hasn't loaded yet —
	     keep them in sync with packages/design/src/index.css. -->
	<style>
		#app-splash {
			position: fixed;
			inset: 0;
			z-index: 2147483000;
			display: none;
			align-items: center;
			justify-content: center;
			background: oklch(0.985 0 0);
			color: oklch(21.779% 0.00002 271.152);
			font-family: "Geist Variable", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			opacity: 1;
			transition: opacity 320ms ease;
			--splash-muted: oklch(55.102% 0.02343 264.389);
			--splash-accent: oklch(0.52 0.20 264);
			--splash-track: oklch(0.52 0.20 264 / 0.16);
			--splash-mark-bg: oklch(21.779% 0.00002 271.152);
			--splash-mark-fg: oklch(0.985 0 0);
			--splash-mark-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.28);
		}
		html.dark #app-splash,
		html[data-theme="dark"] #app-splash {
			background: oklch(20.352% 0.00157 197.844);
			color: oklch(95.514% 0.00011 271.152);
			--splash-muted: oklch(64.009% 0.00007 271.152);
			--splash-accent: oklch(0.70 0.155 264);
			--splash-track: oklch(0.70 0.155 264 / 0.16);
			--splash-mark-bg: oklch(95.514% 0.00011 271.152);
			--splash-mark-fg: oklch(20.352% 0.00157 197.844);
			--splash-mark-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.6);
		}
		html.splash-active #app-splash { display: flex; }
		html.splash-active.splash-hydrated #app-splash {
			opacity: 0;
			pointer-events: none;
		}
		#app-splash .app-splash-plate {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 14px;
			padding: 32px;
			animation: app-splash-plate-in 380ms cubic-bezier(0.16, 1, 0.3, 1) both;
		}
		#app-splash .app-splash-mark {
			display: grid;
			place-items: center;
			width: 56px;
			height: 56px;
			border-radius: 16px;
			background: var(--splash-mark-bg);
			color: var(--splash-mark-fg);
			box-shadow: var(--splash-mark-shadow);
			animation: app-splash-pop 400ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
		}
		#app-splash svg { width: 30px; height: 30px; display: block; }
		#app-splash .app-splash-wordmark {
			font-size: 20px;
			font-weight: 600;
			letter-spacing: -0.01em;
			line-height: 1;
		}
		#app-splash .app-splash-tag {
			font-family: "Geist Mono Variable", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 11px;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--splash-muted);
			line-height: 1;
		}
		/* One line per product surface — a viewer opening a share link shouldn't
		   read workspace copy. Keyed off a class the arming script puts on <html>
		   rather than on the splash itself: that runs in <head>, before the splash
		   element exists, so the right line is present on the very first paint. */
		#app-splash .app-splash-status {
			font-size: 12.5px;
			color: var(--splash-muted);
			line-height: 1;
			margin-top: -2px;
		}
		#app-splash .app-splash-status span { display: none; }
		html.splash-dashboard #app-splash .app-splash-status span[data-for="dashboard"],
		html.splash-share #app-splash .app-splash-status span[data-for="share"] {
			display: inline;
		}
		#app-splash .app-splash-bar {
			position: relative;
			width: 132px;
			height: 3px;
			border-radius: 999px;
			background: var(--splash-track);
			overflow: hidden;
			margin-top: 2px;
		}
		#app-splash .app-splash-bar::after {
			content: "";
			position: absolute;
			inset-block: 0;
			left: 0;
			width: 40%;
			border-radius: inherit;
			background: linear-gradient(90deg, transparent, var(--splash-accent), transparent);
			animation: app-splash-shimmer 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
			will-change: transform;
		}
		@keyframes app-splash-shimmer {
			from { transform: translateX(-120%); }
			to { transform: translateX(350%); }
		}
		@keyframes app-splash-pop {
			from { transform: scale(0.88); opacity: 0; }
			to { transform: scale(1); opacity: 1; }
		}
		@keyframes app-splash-plate-in {
			from { transform: translateY(4px); opacity: 0; }
			to { transform: translateY(0); opacity: 1; }
		}
		@media (prefers-reduced-motion: reduce) {
			#app-splash .app-splash-plate,
			#app-splash .app-splash-mark { animation: none; }
			#app-splash .app-splash-bar::after {
				width: 100%;
				background: var(--splash-accent);
				opacity: 0.85;
				animation: none;
			}
		}
	</style>
	<script>
		// Only arm the splash on product surfaces (mirror of isAppArea in
		// routes/layout.logic.ts — keep the two in sync). Runs before body paint
		// so marketing pages never flash it.
		(() => {
			try {
				const p = location.pathname;
				const surface =
					p.indexOf("/dashboard") === 0 ? "dashboard" : p.indexOf("/share/") === 0 ? "share" : null;
				if (!surface) return;
				const root = document.documentElement;
				root.classList.add("splash-active", `splash-${surface}`);
				// Safety net: if hydration never runs (bundle error, dead network),
				// retire the splash anyway so the viewer is never stuck on it.
				setTimeout(() => {
					const el = document.getElementById("app-splash");
					if (!el) return;
					root.classList.add("splash-hydrated");
					setTimeout(() => {
						if (el) el.remove();
					}, 400);
				}, 10000);
			} catch {
				// The splash is a nicety: a failure here must never block the page.
			}
		})();
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">

	<div style="display: contents">%sveltekit.body%</div>

	<div id="app-splash" aria-hidden="true">
		<div class="app-splash-plate">
		<span class="app-splash-mark">
			<svg viewBox="0 0 584 584" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
				<path d="M200.12 204.56C200.12 167.8 170.32 138 133.56 138C96.7999 138 67 167.8 67 204.56V378.64C67 415.4 96.7999 445.2 133.56 445.2C170.32 445.2 200.12 415.4 200.12 378.64V204.56Z" fill="currentColor" />
				<path d="M358.84 204.56C358.84 167.8 329.04 138 292.28 138C255.52 138 225.72 167.8 225.72 204.56V378.64C225.72 415.4 255.52 445.2 292.28 445.2C329.04 445.2 358.84 415.4 358.84 378.64V204.56Z" fill="currentColor" />
				<path d="M517.56 204.56C517.56 167.8 487.76 138 451 138C414.24 138 384.44 167.8 384.44 204.56V378.64C384.44 415.4 414.24 445.2 451 445.2C487.76 445.2 517.56 415.4 517.56 378.64V204.56Z" fill="currentColor" />
				<path d="M307.28 271.6H275.28C273.071 271.6 271.28 273.39 271.28 275.6V307.6C271.28 309.809 273.071 311.6 275.28 311.6H307.28C309.489 311.6 311.28 309.809 311.28 307.6V275.6C311.28 273.39 309.489 271.6 307.28 271.6Z" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
				<path d="M271.28 271.6V251.6" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
				<path d="M271.28 271.6H251.28" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
				<path d="M311.28 311.6V331.6" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
				<path d="M311.28 311.6H331.28" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
				<path d="M451.28 251.6L486.28 271.6L451.28 291.6L416.28 271.6L451.28 251.6Z" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
				<path d="M416.28 271.6L451.28 291.6V331.6L416.28 311.6V271.6Z" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
				<path d="M486.28 271.6L451.28 291.6V331.6L486.28 311.6V271.6Z" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
			</svg>
		</span>
		<div class="app-splash-wordmark">Recast</div>
		<div class="app-splash-tag">Record · Polish · Share</div>
		<div class="app-splash-status">
			<span data-for="dashboard">Opening your workspace</span>
			<span data-for="share">Preparing the player</span>
		</div>
		<div class="app-splash-bar"></div>
		</div>
	</div>
</body>

</html>
