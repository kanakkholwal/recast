<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<script>
		(() => {
			try {
				const stored = localStorage.getItem("mode-watcher-mode");
				const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
				const resolved = stored && stored !== "system" ? stored : (prefersDark ? "dark" : "light");
				const root = document.documentElement;
				if (resolved === "dark") {
					root.classList.add("dark");
					root.setAttribute("data-theme", "dark");
				} else {
					root.setAttribute("data-theme", "light");
				}
			} catch (_) {
				// Storage can be unavailable in private mode; the OS preference still applies.
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div id="boot" aria-hidden="true">
		<div class="boot-plate">
			<!-- Inline, currentColor mark rather than /logo.svg: that file bakes in a
			     black disc, which vanished against the dark boot background. Also
			     drops a network request from the cold-start path. -->
			<span class="logo-pop boot-logo">
				<svg viewBox="0 0 584 584" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
					<path d="M200.12 204.56C200.12 167.8 170.32 138 133.56 138C96.7999 138 67 167.8 67 204.56V378.64C67 415.4 96.7999 445.2 133.56 445.2C170.32 445.2 200.12 415.4 200.12 378.64V204.56Z" fill="currentColor" />
					<path d="M358.84 204.56C358.84 167.8 329.04 138 292.28 138C255.52 138 225.72 167.8 225.72 204.56V378.64C225.72 415.4 255.52 445.2 292.28 445.2C329.04 445.2 358.84 415.4 358.84 378.64V204.56Z" fill="currentColor" />
					<path d="M517.56 204.56C517.56 167.8 487.76 138 451 138C414.24 138 384.44 167.8 384.44 204.56V378.64C384.44 415.4 414.24 445.2 451 445.2C487.76 445.2 517.56 415.4 517.56 378.64V204.56Z" fill="currentColor" />
				</svg>
			</span>
			<div class="boot-wordmark">Recast</div>
			<div class="boot-tag">Record · Polish · Share</div>

			<!-- Rotating, app-themed status messages -->
			<div class="boot-status">
				<span>Warming up the lens</span>
				<span>Tuning the recorder</span>
				<span>Polishing pixels</span>
				<span>Setting the stage</span>
				<span>Almost ready</span>
			</div>

			<!-- Small indeterminate shimmer loader (primary color) -->
			<div class="boot-loader" role="progressbar" aria-label="Loading Recast"></div>
		</div>

		<style>
			/* Mirrors @recast/design tokens. Inlined because this paints before
			   app.css loads. Keep in sync with packages/design/src/index.css. */
			#boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				box-sizing: border-box;
				background: oklch(0.985 0 0);
				color: oklch(21.779% 0.00002 271.152);
				font-family: "Geist Variable", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				transition: opacity 280ms ease-out;
				will-change: opacity;
				/* Literal copies of --primary / --background / --foreground / --muted-foreground:
				   this paints before app.css. Keep in sync with packages/design/src/index.css. */
				--boot-accent: oklch(0.52 0.20 264);
				--boot-track: oklch(0.52 0.20 264 / 0.16);
				--boot-muted: oklch(55.102% 0.02343 264.389);
				--boot-mark-bg: oklch(21.779% 0.00002 271.152);
				--boot-mark-fg: oklch(0.985 0 0);
				--boot-mark-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.28);
			}

			html.dark #boot,
			html[data-theme="dark"] #boot {
				background: oklch(20.352% 0.00157 197.844);
				color: oklch(95.514% 0.00011 271.152);
				--boot-accent: oklch(0.70 0.155 264);
				--boot-track: oklch(0.70 0.155 264 / 0.16);
				--boot-muted: oklch(64.009% 0.00007 271.152);
				--boot-mark-bg: oklch(95.514% 0.00011 271.152);
				--boot-mark-fg: oklch(20.352% 0.00157 197.844);
				--boot-mark-shadow: 0 12px 34px -10px rgba(0, 0, 0, 0.6);
			}

			#boot.boot-leaving {
				opacity: 0;
				pointer-events: none;
			}

			#boot .boot-plate {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 14px;
				width: 360px;
				padding: 36px 32px;
				animation: boot-plate-in 380ms cubic-bezier(0.16, 1, 0.3, 1) both;
			}

			#boot .logo-pop {
				display: grid;
				place-items: center;
				animation: boot-pop 400ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
				will-change: transform, opacity;
			}

			/* Same rounded-square mark the app chrome and the web splash use. */
			#boot .boot-logo {
				width: 56px;
				height: 56px;
				border-radius: 16px;
				background: var(--boot-mark-bg);
				color: var(--boot-mark-fg);
				box-shadow: var(--boot-mark-shadow);
			}

			#boot .boot-logo svg {
				width: 30px;
				height: 30px;
				display: block;
			}

			#boot .boot-wordmark {
				font-size: 20px;
				font-weight: 600;
				letter-spacing: -0.01em;
				line-height: 1;
			}

			#boot .boot-tag {
				font-family: "Geist Mono Variable", "Space Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 11px;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				color: var(--boot-muted);
				line-height: 1;
			}

			/* Rotating status messages — one shows at a time, CSS-cycled */
			#boot .boot-status {
				position: relative;
				width: 100%;
				height: 15px;
				margin-top: 2px;
			}

			#boot .boot-status span {
				position: absolute;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 12.5px;
				letter-spacing: -0.005em;
				color: var(--boot-muted);
				opacity: 0;
				animation: boot-status-cycle 10s infinite;
				will-change: opacity, transform;
			}

			#boot .boot-status span:nth-child(1) { animation-delay: 0s; }
			#boot .boot-status span:nth-child(2) { animation-delay: 2s; }
			#boot .boot-status span:nth-child(3) { animation-delay: 4s; }
			#boot .boot-status span:nth-child(4) { animation-delay: 6s; }
			#boot .boot-status span:nth-child(5) { animation-delay: 8s; }

			/* Small indeterminate shimmer loader (uses --primary) */
			#boot .boot-loader {
				position: relative;
				width: 132px;
				height: 3px;
				border-radius: 999px;
				background: var(--boot-track);
				overflow: hidden;
			}

			#boot .boot-loader::after {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				height: 100%;
				width: 40%;
				border-radius: inherit;
				background: linear-gradient(
					90deg,
					transparent,
					var(--boot-accent),
					transparent
				);
				animation: boot-shimmer 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
				will-change: transform;
			}

			@keyframes boot-shimmer {
				from { transform: translateX(-120%); }
				to   { transform: translateX(350%); }
			}

			@keyframes boot-status-cycle {
				0%   { opacity: 0; transform: translateY(4px); }
				3%   { opacity: 1; transform: translateY(0); }
				17%  { opacity: 1; transform: translateY(0); }
				20%  { opacity: 0; transform: translateY(-4px); }
				100% { opacity: 0; transform: translateY(-4px); }
			}

			@keyframes boot-pop {
				from { transform: scale(0.88); opacity: 0; }
				to   { transform: scale(1);    opacity: 1; }
			}

			@keyframes boot-plate-in {
				from { transform: translateY(4px); opacity: 0; }
				to   { transform: translateY(0);   opacity: 1; }
			}

			/* Small utility windows (device picker ~320x340, camera preview 240,
			   recording panel 520x72) share this screen; drop the launch branding
			   and shrink the mark so the 360px plate fits without clipping. */
			@media (max-width: 480px), (max-height: 420px) {
				#boot .boot-plate { width: auto; max-width: 92vw; padding: 14px; gap: 10px; }
				#boot .boot-wordmark,
				#boot .boot-tag,
				#boot .boot-status { display: none; }
				#boot .boot-logo { width: 40px; height: 40px; border-radius: 12px; box-shadow: none; }
				#boot .boot-logo svg { width: 22px; height: 22px; }
			}

			/* The recording panel bar is only ~72px tall: a compact mark + loader
			   still fit centered, so the logo stays visible rather than clipped. */
			@media (max-height: 150px) {
				#boot .boot-plate { padding: 6px; gap: 6px; }
				#boot .boot-logo { width: 28px; height: 28px; border-radius: 8px; }
				#boot .boot-logo svg { width: 16px; height: 16px; }
				#boot .boot-loader { width: 96px; }
			}

			@media (prefers-reduced-motion: reduce) {
				#boot .logo-pop,
				#boot .boot-plate,
				#boot .boot-loader::after {
					animation: none;
				}
				/* Show only the first message, statically. */
				#boot .boot-status span {
					animation: none;
				}
				#boot .boot-status span:nth-child(1) {
					opacity: 1;
					transform: none;
				}
				/* Static partial fill instead of a sweep. */
				#boot .boot-loader::after {
					width: 100%;
					background: var(--boot-accent);
					box-shadow: none;
					opacity: 0.85;
				}
			}
		</style>
	</div>

	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
