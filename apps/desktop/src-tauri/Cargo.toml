[package]
name = "Recast"
version = "0.0.0-0"
description = "Screen recording & Editor Agent"
authors = ["Kanak Kholwal"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kanakkholwal/recast"
edition = "2021"
# Reflects the real minimum: the code uses APIs stabilized in 1.81/1.82
# (PanicHookInfo, etc.). CI builds on stable, so this only documents the floor
# and keeps clippy's `incompatible_msrv` honest.
# The VERIFIED floor, not a minimised one: cargo checks each dependency's MSRV
# against the installed rustc, and the tree already needs far newer than the
# 1.82 this used to claim. Raise when a dependency forces it (kstring 2.0.4 is
# pinned back at 2.0.2 for exactly that reason).
rust-version = "1.93.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "recast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Default binary name is the package name ("Recast") on case-sensitive
# filesystems (Linux, macOS). Pin to lowercase so `recast`, the smoke-test
# script, `path_install::symlink`, and the documented CLI verb contract all
# agree. Windows is case-insensitive (Recast.exe / recast.exe both resolve),
# so no platform-specific fallout.
[[bin]]
name = "recast"
path = "src/main.rs"

[dev-dependencies]
recast-testkit = { path = "../../../crates/recast-testkit" }
# Caption parity samples both paths, and only the compositor's takes a shaped face.
recast-text = { path = "../../../crates/recast-text" }
# Scripts an audio device, so the recorder's own loop is testable without one.
capturekit = { path = "../../../crates/capturekit", features = ["serde", "mock"] }
# Goldens are PNGs, not raw RGBA: 5.7 MB of committed binary per fixture set is
# not worth the decode cost saved.
image = "0.25.10"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Every screen, window and camera capture in the app, on all three platforms.
# `serde` because its `Rect` is the rectangle the project format stores.
capturekit = { path = "../../../crates/capturekit", features = ["serde"] }
# Phase 4: the FFmpeg-free encode and mux path the recorder writes through.
recast-codec = { path = "../../../crates/recast-codec" }
recast-mux = { path = "../../../crates/recast-mux" }
recast-captions = { path = "../../../crates/recast-captions" }
recast-scene = { path = "../../../crates/recast-scene" }
recast-time = { path = "../../../crates/recast-time" }
recast-color = { path = "../../../crates/recast-color" }
# The engine, in the shipping binary rather than only in tests. `recast-export`
# is the one render path; the FFmpeg graph is still the default until parity.
recast-compositor = { path = "../../../crates/recast-compositor" }
recast-gpu = { path = "../../../crates/recast-gpu" }
recast-export = { path = "../../../crates/recast-export" }
recast-audio = { path = "../../../crates/recast-audio", features = ["scene"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "wgsl"] }
anyhow = "1.0"
thiserror = "2.0"
crossbeam-queue = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
parking_lot = "0.12"
libc = "0.2"
tauri = { version = "2.10.3", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1.50.0", features = ["full"] }
image = "0.25"
rayon = "1"
base64 = "0.22"
tauri-plugin-dialog = "~2"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
tauri-plugin-os = "2.3.2"
trash = "5.2"
tauri-plugin-opener = "2"
# Native OS share sheet (Windows DataTransferManager, macOS
# NSSharingServicePicker, mobile share panes). Replaces the
# `navigator.share` path — WebView2's Web Share API rejects video/* file
# payloads via `canShare`, which made the web approach useless for
# sharing recordings.
tauri-plugin-sharekit = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "multipart"] }
sha2 = "0.10"
futures-util = "0.3"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# OS-native secrets storage for the cloud session token. On Windows this is
# DPAPI (Credential Manager), on macOS the Keychain, on Linux SecretService
# (libsecret/gnome-keyring/kwallet). Using `apple-native` + `windows-native`
# keeps us off the older platform-specific crates this maps to internally.
# `sync-secret-service` is the default Linux backend — fine for our token
# size; SecretService is async-only behind a feature flag we don't enable.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
# Used to label the cloud session row's User-Agent so the user can identify
# their devices in the future Settings → Devices list. Better Auth captures
# this header into session.userAgent automatically.
hostname = "0.4"
# Loads `apps/desktop/.env` so `CLOUD_API_URL=http://localhost:4420` (and
# any future override) is visible to `std::env::var` from the Rust side.
# Tauri doesn't propagate Vite's .env loading into the Rust process, so
# without this the auth code always falls back to the production URL.
dotenvy = "0.15"
# URL-encode OAuth query params (client_id, redirect_uri, code_challenge, …).
# Hand-rolled encoding is a foot-gun — RFC 3986 reserved chars in PKCE
# verifiers / state tokens have caused real-world OAuth failures.
urlencoding = "2"
# Cryptographic-quality randomness for PKCE code verifier + state token.
# The `getrandom` backend on each OS feeds /dev/urandom or BCryptGenRandom.
rand = "0.8"
# Silence detection runs Silero VAD on `tract` — PURE RUST, no native ONNX
# Runtime. This keeps the always-on silence path OS-agnostic (builds on every
# target, incl. x86_64-apple-darwin where `ort` has no prebuilt). Replaces the
# old `vad-rs` (which pulled `ort`). `silero_vad.onnx` is downloaded on first use
# (see silence.rs); tract runs its Conv+LSTM graph natively.
tract-onnx = "0.21"
# On-device transcription engine: Handy's transcribe.cpp — a ggml-native engine
# (GGUF) that runs 16+ model families (Parakeet, Whisper, Canary, ...) from a
# single .gguf file. Built from source (its -sys crate runs CMake, ggml vendored
# in-tree so NO git submodules), so unlike `ort` it has no prebuilt-binary gap and
# builds on Intel Mac, restoring on-device captions there. Optional + behind the
# default `ggml` feature so a target that can't compile it falls back to
# remote-only. GPU backends (metal/vulkan/cuda) are opt-in features, kept OFF for
# now: CPU (tinyBLAS) is portable; add Metal as a later perf pass. Real per-word
# timing comes back in the run `Transcript` — no synthesis needed.
transcribe-cpp = { version = "0.1.3", optional = true }
# On-device OCR (screen understanding for agent automation), behind the off-by-
# default `ocr` feature. `ocrs` runs on its own `rten` runtime, which is PURE
# RUST with no C / ONNX-Runtime dependency, so it builds on every target incl.
# x86_64-apple-darwin (the reason we use tract for VAD and avoid `ort`). Models
# are the ~10 MB ocrs `.rten` detection + recognition files (download-on-first-
# use, like the Silero VAD model). Version set matches ocrs 0.12.2's own pins.
ocrs = { version = "0.12.2", optional = true }
rten = { version = "0.24", optional = true }
rten-imageproc = { version = "0.24", optional = true }
keepawake = "0.6.0"
tauri-plugin-notification = "2.3.3"
# Argument parser for the headless CLI branch in `main`. One parser covers the
# `recast <verb>` automation surface; the GUI launch path is untouched. See
# docs/cli-automation-plan.md.
clap = { version = "4", features = ["derive"] }
# Cross-platform local IPC (named pipe on Windows, Unix socket on macOS/Linux)
# for the CLI control server the running app hosts. One code path instead of
# per-OS pipe/socket FFI. See control.rs.
interprocess = "2"
# Human-readable CLI output. Data stays JSON internally; the CLI renders YAML
# for terminals (far more readable than JSON for nested lists) and keeps JSON
# for pipes/agents. Archived-but-stable; a display formatter only. See cli.rs.
serde_yaml = "0.9"
# Embedded local store (src/db): the operational/index layer. `bundled` compiles
# SQLite from source (vendored, like keyring/ggml) so there is no system
# libsqlite3 requirement on any target. Files stay authoritative for documents
# (.recast bundles, media); this holds structured operational state: first the
# export queue, later the recordings/exports index. See src/db/mod.rs.
rusqlite = { version = "0.32", features = ["bundled"] }
# Caption font resolution + text measurement for the export burn-in: read a
# face's metrics (the libass size correction), its libass match name, and shape a
# caption line to predict its rendered width (for the exact rounded pill). All
# PURE RUST (no C toolchain), so they build on every target incl. Intel Mac.
# `rustybuzz` is a HarfBuzz port, so shaping matches libass's HarfBuzz closely.
fontdb = "0.23"
ttf-parser = "0.25"
rustybuzz = "0.20"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
# Media Foundation H.264, including the zero-copy texture encode path.
recast-codec-mf = { path = "../../../crates/recast-codec-mf" }
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # AttachConsole + CONOUT$/CONIN$ rebind so the headless CLI branch can
    # print to the launching terminal from the GUI-subsystem release exe.
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Safe user PATH edits for the CLI install action (REG_EXPAND_SZ preserved, no
# NSIS string-truncation footgun). See path_install.rs.
winreg = "0.52"

# X11, the Wayland portal and PipeWire now reach this crate through capturekit,
# which owns every screen backend; the build host still needs
# `libpipewire-0.3-dev` and `libdbus-1-dev` for it.
[target.'cfg(target_os = "linux")'.dependencies]
# Direct handle to the WebKitGTK view behind each Tauri window. Needed to
# flip `enable-media-stream` ON — WebKitGTK ships it OFF (unlike WKWebView /
# WebView2), so `navigator.mediaDevices` is `undefined` and the camera
# preview can't enumerate or open — and to auto-grant the getUserMedia
# `permission-request` (deny-by-default otherwise). Version MUST match the
# one wry resolves (see Cargo.lock) so the type returned by
# `PlatformWebview::inner()` unifies with this crate's `WebView`.
webkit2gtk = "2.0"


[features]
# On-device captions on by default via the ggml (transcribe.cpp) engine. It builds
# from source (CMake + a C/C++ compiler; ggml is vendored, no submodules) on every
# target INCLUDING Intel Mac, so there's no prebuilt-binary gap like `ort` had.
# Silence detection is NOT gated — it runs on pure-Rust `tract`. A target that
# can't compile ggml can still ship with `--no-default-features`: the transcription
# plumbing (catalog, download, device caps, remote endpoints) compiles without the
# feature and the on-device engine seam reports "not available in this build",
# leaving remote endpoints as the transcription path (graceful degradation).
default = ["ggml", "ocr"]
# The on-device transcription engine (transcribe.cpp / ggml). Pulls `transcribe-cpp`,
# which compiles ggml from source. captions_available == cfg!(feature = "ggml").
ggml = ["dep:transcribe-cpp"]
# On-device OCR for screen understanding (agent automation). Pulls the pure-Rust
# ocrs/rten stack, which needs no C toolchain and builds on every target including
# Intel Mac (same rationale as tract for VAD, and lighter than ggml, which is
# already default). ON by default: `tauri build` takes default features, so gating
# this off would ship a binary where the `screen-read` CLI verb / `screen.read`
# control method simply do not exist. Being in `default` also means the plain
# `cargo test` / `cargo clippy` everyone runs covers src/ocr/ with no extra flag.
# The models are fetched on first use, not bundled, so this costs no install size.
# `--no-default-features` still drops it (and ggml) for a minimal build.
ocr = ["dep:ocrs", "dep:rten", "dep:rten-imageproc"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Without single-instance, launching Recast a second time (taskbar shortcut,
# protocol handler, or tray "Show" while a hidden instance is still alive)
# spawns a duplicate process that owns its own recording manager and tray
# icon. The plugin gives us a callback to focus + show the existing main
# window instead. The `deep-link` feature makes it forward a `recast://` URL
# from the second process's argv into the deep-link plugin's on_open_url.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Custom `recast://` URL scheme. Transport only — parsing/routing lives in the
# frontend (src/lib/deepLink.ts). See docs/deep-linking-plan.md.
tauri-plugin-deep-link = "2"
# OS-wide hotkeys (stop/pause a recording while another app is focused). Desktop
# only. Registered + handled in Rust; routes to the panel/main via events.
tauri-plugin-global-shortcut = "2.3.2"

# Optimize DEPENDENCIES even in a debug build, while leaving our own crate at
# opt-level 0 so incremental rebuilds stay fast and stack traces stay useful.
#
# This is load-bearing, not a nicety. `rten` (the OCR inference runtime) is a
# tensor library running convolutions; unoptimized it does bounds-checked scalar
# math with no SIMD and no inlining, which made a `tauri dev` OCR pass over a
# 7-second clip take minutes instead of seconds. The same applies to `image`
# (resize/encode per frame) and the audio/video decode paths. Anything doing
# per-pixel or per-sample work in a loop is unusable at opt-level 0.
#
# Cost: dependencies compile optimized on a clean build (slower the first time,
# then cached). Our own crate is untouched, so the edit-compile loop is unchanged.
[profile.dev.package."*"]
opt-level = 3

# Release shipped at cargo defaults (codegen-units = 16, no LTO) while the hot
# path is per-pixel Rust: `cursor_export.rs` blends 33 MB frames 54,000× on a
# 30-min 4K export, and `rten`/`image`/decode all loop per sample. Cross-crate
# inlining is exactly what those need, and 16 codegen units blocks it.
# `strip = "debuginfo"`, NOT "symbols": the panic hook in telemetry.rs is
# default-on, and dropping symbol names would turn any backtrace we ever capture
# into hex. `panic` stays at unwind because Tauri commands catch panics and
# `spawn_blocking` reports them as errors rather than killing the app.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Curated anti-slop set, mirroring crates/Cargo.toml. Deliberately not
# `pedantic`: its top lints are cast_* and must_use_candidate, which are noise in
# per-pixel and per-sample code rather than signals of bad code.
[lints.clippy]
# Stated here rather than relying on CI's `-D warnings`, so a local run and the
# pipeline give the same answer. Matches the crates workspace.
all = { level = "deny", priority = -1 }
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
inconsistent_struct_constructor = "deny"
inefficient_to_string = "deny"
redundant_else = "deny"
uninlined_format_args = "deny"
unnested_or_patterns = "deny"

# Mirrored from biome.json so Rust and TypeScript are held to one standard.
# Thresholds live in clippy.toml next to this file.
too_many_arguments = "deny"           # biome complexity/useMaxParams
unused_async = "deny"                 # biome suspicious/useAwait
# NOT too_many_lines: 19 hits in the command handlers today. The crates
# workspace denies it; this one owes the cleanup before it can.

